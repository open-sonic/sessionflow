name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the old run, so it stops using minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - if: runner.os == 'Linux'
        # ALSA and PulseAudio for RtAudio and libremidi, X11 and Wayland for SDL3.
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build
          libasound2-dev libpulse-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev
          libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev libdrm-dev libgbm-dev

      - if: runner.os == 'macOS'
        run: brew install ninja

      - run: cmake --preset release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - run: cmake --build --preset release
      - run: ctest --preset release

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so CI and local formatting agree.
      - run: pipx run --spec clang-format==22.1.3 clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')
