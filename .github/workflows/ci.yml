name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - if: runner.os == 'macOS'
        run: brew install ninja

      - run: cmake --preset release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - run: cmake --build --preset release
      - run: ctest --preset release

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so CI and local formatting agree.
      - run: pipx run --spec clang-format==22.1.3 clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')
